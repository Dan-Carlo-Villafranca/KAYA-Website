<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | KAYA</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<header class="navbar">

    <div class="container navbar-inner">

        <a href="../index.html" class="logo">
            KA<span>YA</span>
        </a>

        <nav class="nav-links">

            <a href="client-dashboard.html">
                Dashboard
            </a>

            <a href="search.html">
                Find Work
            </a>

            <a href="profile.html">
                My Profile
            </a>

        </nav>

        <button
            class="btn btn-secondary"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="dashboard-container">
    <!-- Client Welcome Banner -->
    <div class="dashboard-header">
        <h1>Client Workspace</h1>
        <p>Post new job listings, manage active projects, and review candidates.</p>
        <button class="btn btn-primary" id="postJobBtn">+ Post a New Job</button>
    </div>

    <!-- Client Quick Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Active Job Posts</span>
            <span class="stat-value">3</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Total Applicants</span>
            <span class="stat-value">18</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Hired Freelancers</span>
            <span class="stat-value">5</span>
        </div>
    </div>

    <!-- Client Active Listings Section -->
    <section class="dashboard-section">
        <h2>Your Active Job Openings</h2>
        <div class="job-list">
            <!-- Dynamic or styled client listings -->
            <div class="job-card">
                <div class="job-info">
                    <h3>Frontend Web Developer</h3>
                    <p>Posted 3 days ago • 8 Applicants</p>
                </div>
                <button class="btn btn-secondary">Review Applicants</button>
            </div>
        </div>
    </section>
</main>

<!-- 1. Enforce RBAC & Session Check -->
<script type="module" src="../js/app.js"></script>

<!-- 2. Attach logout function to window -->
<script type="module">
    import { logoutUser } from '../js/auth.js';

    window.logout = async function() {
        await logoutUser();
    };
</script>

</body>
</html>
