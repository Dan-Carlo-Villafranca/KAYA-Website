<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | KAYA</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-label">GET STARTED</span>
                <h1>Create Account</h1>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="John Doe" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required />
                </div>

                <div class="form-group">
                    <label>Account Type</label>
                    <div class="role-selection">
                        <label class="role-option">
                            <input type="radio" name="role" value="jobseeker" checked />
                            <span>Jobseeker</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="client" />
                            <span>Client</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>

    <!-- Script imports -->
    <script type="module" src="../js/app.js"></script>
    <script type="module">
        import { registerUser } from '../js/auth.js';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = e.target.fullName.value;
            const email = e.target.email.value;
            const password = e.target.password.value;
            const role = e.target.role.value;

            await registerUser({ email, password, fullName, role });
        });
    </script>
</body>
</html>
